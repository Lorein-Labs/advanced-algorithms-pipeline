name: Build Advanced Algorithms Book (PDF, LaTeX, DOCX)

on:
  push:
    branches: [main, 'feat/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-book:
    name: Quarto Book Publication Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies (TeX Live, Pandoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pandoc \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-xetex

      - name: Set up Quarto CLI (Official Action)
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: prerelease  # Utilise une version récente supportant les extensions >= 1.9.0

      - name: Render Quarto Book (PDF, LaTeX .tex, DOCX)
        working-directory: ./cours
        run: |
          quarto render --to pdf
          quarto render --to docx

      - name: Collect and Organize Deliverables
        run: |
          mkdir -p final-deliverables
          find cours/_build -name "*.pdf" -exec cp {} final-deliverables/ \;
          find cours/_build -name "*.tex" -exec cp {} final-deliverables/ \;
          find cours/_build -name "*.docx" -exec cp {} final-deliverables/ \;

      - name: Upload Academic Deliverables Artifact
        uses: actions/upload-artifact@v4
        with:
          name: advanced-algorithms-academic-outputs
          path: final-deliverables/*
          retention-days: 30
